<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canvas UIクラス</title>
  <style>body{margin:0;background:#f7f4ee;color:#263238;font:1rem/1.8 Georgia,"Yu Mincho",serif}main{width:min(760px,calc(100% - 32px));margin:32px auto}canvas{display:block;width:100%;height:auto;border:1px solid #263238;background:#16262d}code,pre{font-family:monospace}pre{padding:14px;overflow:auto;background:#202c32;color:#edf5f2}a{color:#126782}</style>
</head>
<body>
  <div id="app"></div>
  <script src="../../qs/domDeal.js"></script>
  <script src="../ui.js"></script>
  <script>
    const root = new Deal(document.getElementById("app"));
    const main = root.CE("main");
    new Deal(main).CE("h1", { text: "Canvas UIクラス" });
    new Deal(main).CE("p", { html: '<code>CanvasButton</code> は、ボタンの見た目とクリック判定を一つにまとめます。ホバー色や押下色もクラス側で管理できます。' });
    const canvas = new Deal(main).CE("canvas", { attrs: { id: "ui-sample", width: "640", height: "220" } });
    const message = new Deal(main).CE("p", { id: "message", text: "ボタンを押してください" });
    const ui = new CanvasUI();
    ui.add(new CanvasPanel({ x: 0, y: 0, width: 640, height: 220, color: "#16262d" }));
    ui.add(new CanvasLabel({ x: 24, y: 40, text: "Canvas上の共通UI", font: "bold 22px sans-serif" }));
    ui.add(new CanvasButton({ x: 24, y: 76, width: 230, height: 54, text: "クリック", onClick: () => { message.textContent = "CanvasButton の onClick が呼ばれました"; } }));
    const ctx = canvas.getContext("2d");
    function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height); ui.draw(ctx); requestAnimationFrame(draw); }
    ui.bindTo(canvas);
    draw();
    new Deal(main).CE("pre", { text: 'const button = new CanvasButton({ text: "開始", onClick: startGame });\nui.add(button);\ndisplay.addDrawable(ctx => ui.draw(ctx));' });
    new Deal(main).CE("p", { html: '<a href="./index.html">← 補助教材一覧</a> / <a href="../guide.html#display">総合ガイドのDisplay章</a>' });
  </script>
</body>
</html>
