<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131f">
  <title>LINE DODGER — 弾幕よけ</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="game-shell">
    <header class="brand"><span class="brand-mark">✦</span><div><p class="eyebrow">DANMAKU SURVIVAL</p><h1>LINE DODGER</h1></div></header>
    <div class="canvas-frame">
      <canvas id="game" width="1000" height="625" tabindex="0" aria-label="予告線と弾幕を避けるゲーム"></canvas>
    </div>
    <footer><span>移動 <kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd>　自由移動 <kbd>W</kbd><kbd>S</kbd> / <kbd>↑</kbd><kbd>↓</kbd></span><span>ジャンプ <kbd>Space</kbd> 短押しで低く・長押しで高く</span></footer>
  </main>
  <script type="module" src="./game.js"></script>
