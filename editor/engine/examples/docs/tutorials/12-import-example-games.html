    <section class="exercise-card">
      <h2>サンプルゲームをJSONで読み込む</h2>
      <p>ゲームを選んでJSONプロジェクトをダウンロードし、Studioの「JSON読込」からそのファイルを選んでください。読み込み後は「実行」でゲームを動かせます。</p>
      <div class="example-controls">
        <button type="button" data-project-source="snake.js" data-project-name="snake">へびゲーム</button>

        <span id="project-download-status" role="status" aria-live="polite"></span>
      </div>
      <p><a href="../studio.html">Game Engine Studioを開く</a></p>
    </section>

    <div class="examples-heading">
      <h2>編集して試す</h2>
      <p>ゲームのソースコードとJSONプロジェクトの構造を確認します。</p>
