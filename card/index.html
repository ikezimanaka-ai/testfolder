<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FELT / Card Table</title><link rel="stylesheet" href="../poker/style.css"><link rel="stylesheet" href="../multi-poker/multi.css"><link rel="stylesheet" href="./style.css"></head>
<body><main class="app-shell"><header class="topbar"><div class="brand"><span class="brand-mark">♠</span><div><p class="eyebrow">CARD TABLE ENGINE</p><h1>FELT</h1></div></div><div class="round-status"><span class="live-dot"></span><span id="connectionLabel">接続中</span><span id="revisionLabel">REV 0</span></div><div class="header-actions"><a class="icon-button link-button" href="./room.html">⌂</a></div></header>
<section class="game-toolbar panel"><label>ゲーム<select id="gameSelect"><option value="poker">Poker</option><option value="old-maid">ババ抜き</option><option value="concentration">神経衰弱</option></select></label><button id="startButton" class="primary-button">ゲーム開始</button><button id="resetButton" class="secondary-button">リセット</button><span id="message">参加者を待っています</span></section>
<section class="table-layout"><aside class="players-panel panel"><div class="panel-heading"><div><p class="eyebrow">PLAYERS</p><h2>プレイヤー</h2></div><span id="playerCount" class="player-count">00</span></div><div id="playerList" class="player-list"></div></aside><section class="felt-area"><div class="table-header"><div><p class="eyebrow" id="roomLabel">TABLE</p><h2>共有テーブル</h2></div><div class="ante-display"><span>TABLE COINS</span><strong id="coinValue">0</strong></div></div><div id="tableSurface" class="table-surface"><div class="table-rail"></div><div id="tableCards" class="table-cards"></div><div class="center-message"><span class="center-kicker">CARD TABLE ENGINE</span><strong id="phaseLabel">待機中</strong></div></div><div class="action-bar"><span id="turnHint" class="action-hint">操作を選択してください</span><div class="actions"><button id="dealButton" class="secondary-button">配る</button><button id="coinButton" class="secondary-button">コインを出す</button><button id="turnButton" class="primary-button">ターンを進める</button></div></div></section></section>
<section class="hand-panel panel"><div class="hand-heading"><div><p class="eyebrow">YOUR HAND</p><h2>あなたのカード</h2></div><span id="handCount" class="selection-count">0 cards</span></div><div id="hand" class="hand-row"></div><div class="hand-footer"><p>カードをクリックすると卓上へ出します。公開範囲はゲーム定義に従います。</p><div><button id="collectAllButton" class="ghost-button">カードを全回収</button></div></div></section><div id="toast" class="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./realtime.js"></script><script src="./engine.js"></script><script src="./games.js"></script><script src="./app.js"></script></main></body></html>
