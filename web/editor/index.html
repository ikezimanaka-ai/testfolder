<!doctype html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SVG Engine Editor</title>
	<link rel="stylesheet" href="editor.css">
	<link rel="stylesheet" href="https://unpkg.com/svgedit@7.4.2/dist/editor/svgedit.css">
	<style>
		@media (min-width: 621px) { .editor-shell { grid-template-columns: 2fr 1fr; } }
		#svg-editor { min-width: 0; height: 430px; padding: 0; overflow: hidden; }
		#svg-editor-host { width: 100%; height: 100%; }
		.monaco-editor textarea.inputarea { display: block !important; }
	</style>
</head>
<body>
	<main class="editor-shell">
		<aside class="sidebar">
			<header class="brand"><span class="eyebrow">SVG ENGINE EDITOR</span><h1>Scene builder</h1><p id="selection-label">Engineを選択中</p></header>
			<section class="object-browser">
				<div class="section-title"><strong>OBJECTS</strong><button id="new-object" class="accent">＋ Object</button></div>
				<div id="object-list" class="object-list"></div>
			</section>
			<div class="sidebar-scroll">
				<section id="engine-settings" class="settings-panel">
					<div class="panel-title"><span>EngineSetting</span><small>SCENE</small></div>
					<div class="field-grid"><label>Canvas width<input id="canvas-width" type="number" min="1" value="960"></label><label>Canvas height<input id="canvas-height" type="number" min="1" value="540"></label></div>
					<label class="check"><input id="canvas-transparent" type="checkbox" checked> transparent background</label>
					<fieldset><legend>Initial Programs</legend><div id="engine-initial-editor" class="monaco-box"></div><textarea id="engine-initial-program" spellcheck="false"></textarea></fieldset>
					<fieldset><legend>Frame Programs</legend><div id="engine-frame-editor" class="monaco-box"></div><textarea id="engine-frame-program" spellcheck="false"></textarea></fieldset>
					<div id="engine-error" class="error"></div>
				</section>
				<form id="object-settings" class="settings-panel" hidden>
					<div class="panel-title"><span>ObjectSetting</span><small id="object-id-label"></small></div>
					<nav class="tabs main-tabs" aria-label="Object settings tabs"><button type="button" data-tab="identity" class="active">Identity</button><button type="button" data-tab="svg">SVGEditor</button><button type="button" data-tab="programs">Programs</button></nav>
					<div class="tab-panel active" data-panel="identity">
						<label>Object ID<input id="object-id" required></label><label>Tag<input id="tag" placeholder="player, enemy"></label>
						<div class="field-grid"><label>X<input id="x" type="number"></label><label>Y<input id="y" type="number"></label><label>Width<input id="width" type="number" min="1"></label><label>Height<input id="height" type="number" min="1"></label><label>Size (%)<input id="size" type="number" min="0" max="100" value="100"></label><label>Ghost (%)<input id="ghost" type="number" min="0" max="100" value="100"></label></div>
						<p class="hint">Sizeは縦横の倍率、Ghostは不透明度です。0は hidden と同じです。</p>
					</div>
					<div class="tab-panel" data-panel="svg">
						<div class="svg-toolbar"><button type="button" id="add-svg-tab">＋ Blank</button><button type="button" id="import-svg">↥ SVG file</button><button type="button" id="insert-local-image">▧ Local image</button><button type="button" id="import-image">▧ Image as tab</button><input id="svg-file" type="file" accept="image/svg+xml,.svg" hidden><input id="local-image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden></div>
						<div id="svg-tabs" class="svg-tabs"></div><div class="svg-editor-head"><input id="svg-tab-name" aria-label="SVG tab name"><span id="svg-tab-size" class="hint"></span></div><div id="svg-editor" class="svg-editor"><div id="svg-editor-host"></div></div>
					</div>
					<div class="tab-panel" data-panel="programs">
						<fieldset><legend>Initial Programs</legend><div id="initial-program-editor" class="monaco-box"></div><textarea id="initial-program" spellcheck="false"></textarea></fieldset>
						<fieldset><legend>Frame Programs</legend><div id="program-editor" class="monaco-box"></div><textarea id="program" spellcheck="false"></textarea></fieldset><div id="program-error" class="error"></div>
					</div>
					<button id="delete-object" type="button" class="danger">Objectを削除</button>
				</form>
			</div>
		</aside>
		<section class="stage">
			<header class="topbar"><div><span class="eyebrow">LIVE PREVIEW</span><h2>Scene canvas</h2></div><div class="toolbar"><button id="start">▶ Start</button><button id="stop">■ Stop</button><button id="reset">↺ Reset</button><button id="debug">⌁ Debug</button><button id="save-project">💾 Save</button><button id="load-project">📂 Load</button><button id="fullscreen" title="Canvasを全画面表示">⛶</button></div></header>
			<input id="project-file" type="file" accept=".json" hidden>
			<div class="canvas-wrap" id="canvas-wrap"><canvas id="editor-canvas" width="960" height="540" tabindex="0" aria-label="Scene preview"></canvas></div>
			<section class="preview-status"><span id="canvas-size-label">960 × 540</span><span id="runtime-state">READY</span></section>
		</section>
	</main>
	<div id="context-menu" class="context-menu" hidden><button id="duplicate-object">複製</button><button id="context-delete">削除</button></div>
	<script src="../engine.js"></script><script src="./editor.js"></script>
</body>
</html>
