<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>四角をよけろ</title>
  <style>
    :root { color: #263238; background: #f7f4ee; font-family: Georgia, "Yu Mincho", serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    #dodge-app { width: min(880px, calc(100% - 28px)); margin: 36px auto; }
    h1 { color: #126782; margin-bottom: 8px; }
    canvas { display: block; width: 100%; height: auto; border: 4px solid #263238; background: #16262d; image-rendering: auto; }
    .dodge-panel { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin: 16px 0; }
    .dodge-panel strong { color: #b85c38; }
    .dodge-panel span { padding: 5px 9px; background: #dceff2; }
    button { padding: 9px 14px; border: 1px solid #126782; background: #126782; color: white; cursor: pointer; font: inherit; }
    a { color: #126782; }
    @media (max-width: 560px) { #dodge-app { margin-top: 20px; } .dodge-panel { display: grid; grid-template-columns: 1fr 1fr; } .dodge-panel strong, button { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../qs/domDeal.js"></script>
  <script src="./engine.js"></script>
  <script src="./ui.js"></script>
  <script src="./dodge.js"></script>
</body>
</html>
