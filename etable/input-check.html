<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101819">
  <title>Engine Input Check</title>
  <style>
    :root { color-scheme: dark; background: #101819; color: #eef3e9; font-family: "DM Sans", "Noto Sans JP", sans-serif; }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: #101819; }
    body { min-width: 320px; margin: 0; background: radial-gradient(ellipse at 48% 0%, #1c302b 0, #101819 55%); }
    main { display: grid; width: max(100vw, 960px); min-width: 960px; min-height: 100vh; place-items: center; }
    canvas { display: block; width: min(max(100vw, 960px), 1440px, 160vh); height: auto; aspect-ratio: 5 / 3; outline: none; touch-action: none; }
    canvas:focus-visible { outline: 2px solid #a8e8c6; outline-offset: -3px; }
  </style>
</head>
<body>
  <main>
    <canvas id="check-canvas" width="1800" height="1080" tabindex="0" aria-label="エンジンの日本語入力確認画面"></canvas>
  </main>
  <script type="module">
    import { Engine, Display, GameObject, INPUT } from '../editor/engine/engine.js';
    import { TextInputObject } from '../editor/engine/ui-objects.js';

    const canvas = document.querySelector('#check-canvas');
    const engine = new Engine(canvas, 30, 1000, 600);
    const display = engine.newDisplay(new Display('input-check', 1000, 600));
    const logs = [];
    const fields = [];

    function log(type, detail = {}) {
      logs.push(`${new Date().toLocaleTimeString('ja-JP', { hour12: false })} ${type} ${JSON.stringify(detail)}`);
      if (logs.length > 100) logs.shift();
    }

    function addInput(label, x, y, width, placeholder) {
      const field = new TextInputObject({
        x, y, width, height: 42, label, placeholder,
        maxLength: 500, value: '', fontSize: 14, fontFamily: 'sans-serif',
        color: '#eef3e9', background: '#111b1b', border: '#52675d', focusedBorder: '#8ed8b5'
      });
      const start = field.onStart.bind(field);
      field.onStart = function startLoggingInput() {
        start();
        const input = this.inputElement;
        input.setAttribute('aria-label', label);
        input.addEventListener('focus', () => log('focus', { field: label }));
        input.addEventListener('blur', () => log('blur', { field: label }));
        for (const type of ['compositionstart', 'compositionupdate', 'compositionend', 'beforeinput', 'input', 'change']) {
          input.addEventListener(type, event => {
            const detail = { field: label, value: input.value, engineKeys: [...INPUT.keys] };
            if ('data' in event && event.data !== null) detail.data = event.data;
            if ('inputType' in event) detail.inputType = event.inputType;
            if ('isComposing' in event) detail.isComposing = event.isComposing;
            log(type, detail);
          });
        }
        for (const type of ['keydown', 'keyup']) {
          input.addEventListener(type, event => log(type, {
            field: label, key: event.key, keyCode: event.keyCode,
            isComposing: event.isComposing, engineKeys: [...INPUT.keys]
          }));
        }
      };
      field.onInput = value => {
        log('value', { field: label, value });
        engine.render();
      };
      engine.addObject(display, field);
      fields.push(field);
      return field;
    }

    const textInput = addInput('1行入力', 54, 146, 852, 'ここに日本語を入力');
    const secondInput = addInput('2つ目の入力欄', 54, 238, 852, 'こちらにも日本語を入力できます');

    const screen = new GameObject({
      x: 0, y: 0, width: 1000, height: 600,
      onDraw(ctx) {
        ctx.fillStyle = '#172321';
        ctx.strokeStyle = '#30403c';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(16, 12, 968, 576, 14);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#a8e8c6';
        ctx.font = '700 18px monospace';
        ctx.fillText('ENGINE INPUT CHECK', 34, 40);
        ctx.fillStyle = '#b7c8bf';
        ctx.font = '13px sans-serif';
        ctx.fillText('engine.js と ui-objects.js の入力欄で、日本語 IME とキー状態を確認します。', 54, 76);
        ctx.fillText('変換確定後の値、composition イベント、入力欄外での blur を下のログで確認してください。', 54, 99);
        ctx.fillStyle = '#dce7df';
        ctx.font = '600 12px sans-serif';
        ctx.fillText('1行入力', 54, 137);
        ctx.fillText('複数行入力', 54, 229);

        ctx.fillStyle = '#16221f';
        ctx.strokeStyle = '#52675d';
        ctx.beginPath();
        ctx.roundRect(54, 340, 852, 54, 8);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#a8e8c6';
        ctx.font = '600 13px sans-serif';
        ctx.fillText('通常キーのテスト: この枠をクリックして英字キーを押す', 68, 362);
        ctx.fillStyle = '#dce7df';
        ctx.font = '12px ui-monospace, monospace';
        ctx.fillText(`a の押下状態: ${INPUT.onKey('a') ? 'DOWN' : 'up'}　pressed: ${INPUT.pressed('a')}`, 68, 384);
        ctx.fillText(`エンジンが追跡中のキー: ${[...INPUT.keys].join(', ') || 'なし'}`, 54, 420);

        ctx.fillStyle = '#dce7df';
        ctx.font = '700 13px sans-serif';
        ctx.fillText('イベントログ', 54, 449);
        ctx.fillStyle = '#19342b';
        ctx.beginPath();
        ctx.roundRect(800, 430, 106, 27, 6);
        ctx.fill();
        ctx.fillStyle = '#a8e8c6';
        ctx.font = '600 11px sans-serif';
        ctx.fillText('ログ消去', 825, 448);
        ctx.fillStyle = '#20342c';
        ctx.beginPath();
        ctx.roundRect(54, 460, 852, 100, 7);
        ctx.fill();
        ctx.fillStyle = '#bfe5d0';
        ctx.font = '11px ui-monospace, monospace';
        logs.slice(-5).forEach((line, index) => ctx.fillText(line, 66, 480 + index * 17, 828));
        ctx.fillStyle = '#e1bb67';
        ctx.font = '12px sans-serif';
        const focus = fields.find(field => field.focused)?.label || 'なし';
        ctx.fillText(`入力フォーカス: ${focus}　|　${textInput.value || '—'}　/　${secondInput.value || '—'}`, 54, 576, 850);
      }
    });
    display.sendToBack(screen);

    canvas.addEventListener('pointerdown', event => {
      const point = engine.pointerToLogical(event);
      if (engine._hitTest(point) === null) {
        for (const field of fields) field.blur();
        if (point.x >= 54 && point.x <= 906 && point.y >= 340 && point.y <= 394) canvas.focus();
        if (point.x >= 800 && point.x <= 906 && point.y >= 430 && point.y <= 457) {
          logs.length = 0;
          log('log.cleared');
        }
        engine.render();
      }
    });

    log('ready', { engine: 'Engine', inputObject: 'TextInputObject' });
    engine.start();
  </script>
</body>
</html>
