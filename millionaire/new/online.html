<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>大富豪オンライン</title>
  <link rel="stylesheet" href="./multi-poker.css">
  <link rel="stylesheet" href="./online.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><p class="eyebrow">ONLINE TABLE</p><h1 id="room-title">大富豪オンライン</h1></div>
      <div class="top-actions"><span id="room-status" role="status">接続中...</span><a class="secondary" href="./index.html">部屋一覧</a></div>
    </header>
    <p id="room-notice" class="notice" role="status" aria-live="polite"></p>
    <div class="online-layout">
      <section class="online-main">
        <section class="panel online-card">
          <div class="online-toolbar">
            <div><h2 id="phase-title">待機中</h2><p id="phase-detail" class="online-help">参加者が集まるまでお待ちください。</p></div>
            <div class="online-actions">
              <button id="start-game-online" class="primary" type="button" hidden>ゲーム開始</button>
              <button id="abort-game-online" class="secondary" type="button" hidden>ゲームを強制終了</button>
              <button id="leave-room" class="secondary" type="button">部屋を出る</button>
              <button id="dissolve-room" class="secondary" type="button" hidden>部屋を解散</button>
            </div>
          </div>
          <div id="online-players" class="online-players"></div>
        </section>
        <section id="online-game" class="panel online-card" hidden>
          <div class="field-heading"><h2>場</h2><span id="online-field-rule"></span></div>
          <div id="online-field-cards" class="cards field-cards"></div>
          <div id="spectator-notice" class="spectator" hidden>観戦中です。ゲーム終了後、待機状態から参加できます。</div>
          <div class="control-heading"><h2>あなたの手札</h2><span id="online-selection-count"></span></div>
          <div id="online-hand" class="cards hand online-hand"></div>
          <div id="online-effects" class="effect-controls"></div>
          <div class="online-actions">
            <button id="play-card-action" class="primary" type="button">出す</button>
            <button id="pass-action" class="secondary" type="button">パス</button>
          </div>
        </section>
      </section>
      <aside class="online-sidebar">
        <section class="panel online-card online-chat">
          <h2>部屋チャット</h2>
          <ol id="online-chat-messages" class="online-chat-messages" aria-live="polite" aria-relevant="additions"></ol>
          <form id="online-chat-form" class="online-chat-form">
            <label class="visually-hidden" for="online-chat-input">チャットメッセージ</label>
            <input id="online-chat-input" type="text" maxlength="300" autocomplete="off" placeholder="メッセージを入力" required>
            <button class="primary" type="submit">送信</button>
          </form>
        </section>
        <section class="panel online-card"><h2>ゲームログ</h2><ol id="online-log" class="online-log"></ol></section>
      </aside>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script>
  <script type="module" src="./online.js?v=20261006-daifugo-engine"></script>
</body>
</html>
