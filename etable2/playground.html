<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETABLE2 Engine / UI Playground</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body { padding: 18px; }
    main { display: block; width: min(100%, 1100px); min-width: 0; min-height: 0; margin: auto; }
    h1 { font-size: 22px; margin: 4px 0 8px; }
    p { color: #b8c8bf; line-height: 1.5; }
    .engines { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 14px; align-items: start; }
    .panel { background: #172321; border: 1px solid #30403c; border-radius: 12px; padding: 12px; min-width: 0; }
    .panel h2 { font-size: 15px; margin: 0 0 9px; }
    .canvas-host { position: relative; width: 100%; aspect-ratio: 5 / 3; overflow: hidden; }
    .demo-canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: 0; }
    #scene-canvas { aspect-ratio: 16 / 9; }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    button { color: #eef3e9; background: #294239; border: 1px solid #486359; border-radius: 7px; padding: 7px 10px; cursor: pointer; }
    output { display: block; color: #a8e8c6; min-height: 1.4em; font-size: 13px; }
    @media (max-width: 760px) { .engines { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>ETABLE2 Engine / UI Playground</h1>
  <p>各 UI Object を Canvas 上で操作できます。テキスト欄は日本語 IME、数値欄は制約、ボタンとスライダーはポインター、スクロール枠はホイールで確認してください。Scene Engine のボタンで画面を切り替えます。</p>
  <div class="engines">
    <section class="panel">
      <h2>Canvas Object Engine — UI Objects 全クラス</h2>
      <div class="canvas-host"><canvas id="objects-canvas" class="demo-canvas" width="1000" height="600" aria-label="UI Objects playground"></canvas></div>
      <output id="log" aria-live="polite">準備中</output>
    </section>
    <section class="panel">
      <h2>Scene Engine — Scene lifecycle / input</h2>
      <div class="canvas-host" style="aspect-ratio:16/9"><canvas id="scene-canvas" class="demo-canvas" width="640" height="360" aria-label="Scene Engine playground"></canvas></div>
      <div class="buttons"><button id="scene-lobby">Lobby Scene</button><button id="scene-table">Table Scene</button><button id="debug-toggle">Hitbox debug</button><button id="timer-button">Start timer</button></div>
      <output id="scene-log" aria-live="polite"></output>
      <p>Object Engine のタイマー、衝突・ヒットテスト、ポインター座標、キーボード INPUT は下のログでも確認できます。</p>
    </section>
  </div>
</main>
<script type="module" src="./playground.js"></script>
</body>
</html>
