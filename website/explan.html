<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>README Viewer</title>
  <!-- marked.js の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.9/lib/marked.umd.min.js"></script>
</head>
<body>
  <!-- 変換後のHTMLを表示するエリア -->
  <div id="content">読み込み中...</div>

  <script>
    fetch('./README.md')
      .then(response => response.text())
      .then(markdownText => {
        // マークダウンをHTMLに変換して要素に代入
        document.getElementById('content').innerHTML = marked.parse(markdownText);
      })
      .catch(error => {
        document.getElementById('content').innerText = '読み込みに失敗しました。';
      });
  </script>
</body>
</html>
