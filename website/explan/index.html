<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>補助教材</title><style>body{margin:0;background:#f7f4ee;color:#263238;font:1.05rem/1.8 Georgia,"Yu Mincho",serif}main{width:min(760px,calc(100% - 32px));margin:40px auto}section{padding:24px;margin:18px 0;border:1px solid #d9d1c5;background:#fffdf9}a{color:#126782}h1{border-bottom:4px solid #126782;padding-bottom:12px}h2{color:#126782}code{background:#e9e4da;padding:2px 5px}ul{line-height:2.2}</style></head>
<body><div id="app"></div><script src="../../qs/domDeal.js"></script><script>
const root = new Deal(document.getElementById("app"));
const main = root.CE("main");
new Deal(main).CE("h1", { text: "website 補助教材" });
new Deal(main).CE("p", { text: "ガイド本体の各章を、短い実験ごとに分けたページです。どのページも domDeal.js で本文を組み立てています。" });
const cards = [
  ["dom.html", "DOMを作る", "Deal.CE / CCE と Aタグの章リンクを小さく試します。"],
  ["canvas.html", "Canvasに描く", "CD1 / CD3 の違いと、座標が変換される様子を確認します。"],
  ["engine.html", "Engineを動かす", "GameObject、Display、入力、ゲームループの関係を一枚にまとめます。"],
  ["dodge.html", "回避ゲームの仕組み", "dt、障害物、衝突、無敵時間、ゲームオーバーを順番に読みます。"],
  ["ui.html", "Canvas UIクラス", "CanvasButtonなど、ゲーム内ボタンを再利用する方法を確認します。"]
];
for (const [href, title, text] of cards) {
  const section = new Deal(main).CE("section");
  new Deal(section).CE("h2", { text: title });
  new Deal(section).CE("p", { text });
  new Deal(section).CE("a", { attrs: { href }, text: "この教材を開く" });
}
new Deal(main).CE("p", { html: '<a href="../guide.html">← 詳しい総合ガイドへ戻る</a>' });
</script></body></html>
